# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - prettier@3.9.6
    - actionlint@1.7.12
    - checkov@3.3.9
    - git-diff-check
    - grype@0.116.1
    - pinact@4.1.1
    - trufflehog@3.96.0
    - yamllint@1.38.0
    # prettier formats with singleQuote (see configs/.prettierrc), matching the
    # style the TypeScript sources were already written in.
    # markdownlint: no documentation formatting baseline adopted yet.
    # osv-scanner: current advisories are dev-only test tooling (vitest/vite/
    # esbuild in pnpm-lock.yaml), not runtime deps; re-enable when runtime
    # dependencies are published.
  ignore:
    # Generated file; its formatting is owned by generate-vocabulary.mjs,
    # so prettier would fight the regenerator on every SDK bump.
    - linters: [prettier]
      paths: [packages/core/src/vocabulary.ts]
    # Generated bundle; its content is owned by bundle-shim.mjs, which
    # `pnpm quality` re-runs with --check. Linting 15k bundled lines reports on
    # the bundler's choices, not on anything anyone here can act on.
    #
    # Named linters, not ALL: this file is exported and is also shipped inside
    # the pi adapter's npm tarball, so exempting it from ALL exempted the one
    # generated artifact that reaches both from trufflehog — the only credential
    # scanner this repository runs.
    - linters: [prettier]
      paths: [adapters/pi/shim.mjs]
    # Recorded probe output. The probe — and, for the published projection,
    # scripts/project-conformance-matrix.mjs — writes these with
    # JSON.stringify(…, 2) and a trailing newline; reformatting them makes the
    # committed measurement differ byte-wise from what the next run produces, so
    # a real capability change would arrive buried in a whole-file reformat.
    # packages/conformance/test/adapterRecord.test.ts compares an adapter record
    # against that exact serialisation, so a reformat here fails there.
    - linters: [prettier]
      paths:
        - docs/conformance/**
        - adapters/*/conformance.json
    # Records, not maintained documents: written once and thereafter read.
    # Release notes carry a source hash their Chinese peer records, so
    # reformatting one silently invalidates a translation that is still
    # accurate.
    - linters: [prettier]
      paths:
        - docs/releases/**
        - docs/quality/**
        - packages/test-results/**
    # pnpm owns this file's format; it is regenerated by the package manager
    # and diffed by `--frozen-lockfile`.
    - linters: [prettier]
      paths: [pnpm-lock.yaml]
actions:
  enabled:
    - trunk-upgrade-available
